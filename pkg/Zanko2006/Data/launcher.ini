# Zanko 2006 launcher settings
# update_url: URL of a plain-text update manifest. Leave empty until the update host (e.g. GitHub) exists.
#   Manifest format:
#     version=0.1.1
#     file=Root/Zanko.exe|https://example.com/Zanko.exe
#     file=Data/news.txt|https://example.com/news.txt
#   {channel} in the URL is replaced with the selected update channel (stable/beta).
update_url=https://raw.githubusercontent.com/FACKERSK/Zanko-2006/main/update/{channel}.txt
lastUser=
closeOnPlay=1
