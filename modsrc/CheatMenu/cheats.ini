# Zanko 2006 - Cheat Menu settings
# This file switches the in-game cheat menu on. Untick the mod in the launcher's Mods tab to switch it off.

# Key that opens the menu during play: F1-F10, F12 or INSERT
key=F8

# What is already on when a game starts or a save loads (1 = on, 0 = off)
god=0
stamina=0
needs=0
ammo=0
unbreakable=0
onehit=0
noclip=0
peaceful=0
freezetime=0
light=0

# Move speed multiplier, 0.5 - 4
speed=1.0
